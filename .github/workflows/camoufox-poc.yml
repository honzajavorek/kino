name: camoufox-poc

# Throwaway PoC workflow: does Camoufox get past csfd.cz's anti-bot wall?
# Delete this file and poc/camoufox_poc.py once we know the answer.

on:
  push:
    branches: [claude/camoufox-poc]
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # camoufox has known install issues on 3.13+

      - name: Install Camoufox
        run: |
          pip install camoufox playwright
          python3 -m camoufox fetch

      - name: Run PoC
        run: python3 poc/camoufox_poc.py
