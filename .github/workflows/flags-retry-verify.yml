name: flags-retry-verify

# Throwaway: verifies fetch_html()'s retry-on-denial actually recovers, and
# that a real failure now reports what happened. Delete once confirmed.

on:
  push:
    branches: [claude/flags-retry-and-diagnostics]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Tests
        run: uv run pytest

      - name: Code
        run: uv run ruff check

      - name: Install Camoufox
        run: uv run camoufox fetch

      - name: Diagnose flags fetch
        run: |
          uv run python -c "
          import asyncio
          from kino.csfd import fetch_html
          from kino.flags import FLAGS_URL

          async def main():
              html = await fetch_html(FLAGS_URL, timeout=30000)
              print('content length:', len(html))
              print('select count:', html.count('<select'))
              for marker in ('cookie', 'consent', 'OneTrust', 'gdpr', 'Přihlásit', 'login'):
                  print(f'{marker!r} occurrences:', html.lower().count(marker.lower()))
              print('--- first 3000 chars ---')
              print(html[:3000])
              print('--- last 1000 chars ---')
              print(html[-1000:])

          asyncio.run(main())
          "
