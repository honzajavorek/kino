name: flags-retry-verify

# Throwaway: verifies fetch_html()'s retry-on-denial actually recovers, and
# that a real failure now reports what happened. Delete once confirmed.

on:
  push:
    branches: [claude/flags-retry-and-diagnostics]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Tests
        run: uv run pytest

      - name: Code
        run: uv run ruff check

      - name: Install Camoufox
        run: uv run camoufox fetch

      - name: Diagnose flags fetch
        run: |
          uv run python -c "
          import asyncio
          from camoufox.async_api import AsyncCamoufox
          from kino.flags import FLAGS_URL

          async def main():
              async with AsyncCamoufox(headless=True) as browser:
                  page = await browser.new_page()
                  response = await page.goto(FLAGS_URL, wait_until='networkidle', timeout=30000)
                  print('status:', response.status if response else None)
                  print('final url:', page.url)
                  print('headers:', dict(response.headers) if response else None)
                  print('title:', await page.title())
                  body_len = len(await page.content())
                  print('content length:', body_len)
                  text = await page.inner_text('body')
                  print('body text (first 500):', text[:500])
                  select_count = len(await page.query_selector_all('select'))
                  print('select elements found:', select_count)

          asyncio.run(main())
          "
