name: flags-retry-verify

# Throwaway: verifies fetch_html()'s retry-on-denial actually recovers, and
# that a real failure now reports what happened. Delete once confirmed.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Tests
        run: uv run pytest

      - name: Code
        run: uv run ruff check

      - name: Install Camoufox
        run: uv run camoufox fetch

      - name: Diagnose flags fetch
        run: |
          uv run python -c "
          import asyncio
          from kino.csfd import fetch_html
          from kino.flags import FLAGS_URL
          from kino.scraper import CSFD_URL

          URLS = [
              FLAGS_URL,
              CSFD_URL,
              'https://www.csfd.cz/film/2358-vecerni-skola/',
              'https://www.csfd.cz/',
          ]

          async def check(url):
              print(f'=== {url} ===')
              try:
                  html = await fetch_html(url, timeout=30000)
              except Exception as exc:
                  print('error:', repr(exc))
                  raise
              has_body = '<body' in html
              print('content length:', len(html), '| has <body>:', has_body)
              if not has_body:
                  print('tail:', html[-300:])
                  raise RuntimeError('response has no body')

          async def main():
              for url in URLS:
                  await check(url)

          asyncio.run(main())
          "
