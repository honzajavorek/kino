name: session-reuse-verify

on:
  push:
    branches:
      - claude/reuse-anubis-cookie

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Camoufox
        run: uv run camoufox fetch

      - name: Measure browser-launch time vs post-launch time per page
        run: |
          uv run python -c "
          import asyncio
          import time

          from crawlee import ConcurrencySettings
          from crawlee.crawlers import PlaywrightPostNavCrawlingContext

          from kino.csfd import get_csfd_crawler

          urls = [
              f'https://www.csfd.cz/film/{slug}/prehled/'
              for slug in [
                  '8283-posledni-skaut',
                  '1-forrest-gump',
                  '2410-matrix',
                  '9822-vykoupeni-z-veznice-shawshank',
                  '4-pulp-fiction',
                  '2024-gladiator',
                  '696-schindleruv-seznam',
                  '9928-goodfellas-pratele',
              ]
          ]
          launches = []
          fetches = []

          async def main():
              crawler = get_csfd_crawler(
                  concurrency_settings=ConcurrencySettings(
                      max_concurrency=1, desired_concurrency=1
                  ),
              )

              @crawler.router.default_handler
              async def handler(context: PlaywrightPostNavCrawlingContext) -> None:
                  cookies = await context.page.context.cookies()
                  anubis_cookies = [c['name'] for c in cookies if 'anubis' in c['name'].lower()]
                  title = await context.page.title()
                  fetches.append(time.monotonic())
                  print(f'{context.request.url}: title={title!r}, cookies={anubis_cookies}')

              launch_t0 = time.monotonic()

              @crawler._browser_pool.post_launch_hook
              async def _on_launch(page_id, controller):
                  nonlocal launch_t0
                  launches.append(time.monotonic() - launch_t0)
                  launch_t0 = time.monotonic()

              t0 = time.monotonic()
              launch_t0 = t0
              await crawler.run(urls)

              fetch_durations = [
                  (fetches[i] - (fetches[i - 1] if i else t0))
                  for i in range(len(fetches))
              ]
              print()
              print('Browser launch durations:', [f'{d:.2f}s' for d in launches])
              print('Total per-request durations (launch+navigate+solve+handler):', [f'{d:.2f}s' for d in fetch_durations])
              print('Post-launch durations (navigate+solve+handler only):', [
                  f'{(fetch_durations[i] - launches[i]):.2f}s' if i < len(launches) else 'n/a'
                  for i in range(len(fetch_durations))
              ])

          asyncio.run(main())
          "
