name: session-reuse-verify

on:
  push:
    branches:
      - claude/reuse-anubis-cookie

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Camoufox
        run: uv run camoufox fetch

      - name: Verify Anubis cookie is reused across pages in one crawl
        run: |
          uv run python -c "
          import asyncio
          import time

          from crawlee import ConcurrencySettings
          from crawlee.crawlers import PlaywrightPostNavCrawlingContext

          from kino.csfd import get_csfd_crawler

          urls = [
              'https://www.csfd.cz/film/8283-posledni-skaut/prehled/',
              'https://www.csfd.cz/film/1-forrest-gump/prehled/',
              'https://www.csfd.cz/film/2410-matrix/prehled/',
          ]
          checkpoints = []

          async def main():
              # Sequential on purpose: request N+1 must only start once N's
              # handler (and so its cookie sync) has finished, or the timing
              # comparison below would be meaningless.
              crawler = get_csfd_crawler(
                  concurrency_settings=ConcurrencySettings(
                      max_concurrency=1, desired_concurrency=1
                  ),
              )

              @crawler.router.default_handler
              async def handler(context: PlaywrightPostNavCrawlingContext) -> None:
                  cookies = await context.page.context.cookies()
                  anubis_cookies = [c['name'] for c in cookies if 'anubis' in c['name'].lower()]
                  title = await context.page.title()
                  checkpoints.append(time.monotonic())
                  print(f'{context.request.url}: title={title!r}, cookies={anubis_cookies}')

              t0 = time.monotonic()
              await crawler.run(urls)
              durations = [
                  (checkpoints[i] - (checkpoints[i - 1] if i else t0))
                  for i in range(len(checkpoints))
              ]
              print('Per-request durations:', [f'{d:.2f}s' for d in durations])
              assert len(durations) == 3, f'expected 3 successful fetches, got {len(durations)}'
              assert durations[1] < durations[0] / 2 or durations[2] < durations[0] / 2, (
                  'expected at least one later fetch to be much faster than the first (cookie reuse)'
              )
              print('OK')

          asyncio.run(main())
          "
