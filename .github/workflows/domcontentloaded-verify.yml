name: domcontentloaded-verify

# Throwaway: verifies get_csfd_crawler() against the exact URL and code path
# that failed in production (run 35728379332). Delete once confirmed.

on:
  push:
    branches: [claude/domcontentloaded-fix]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Tests
        run: uv run pytest

      - name: Code
        run: uv run ruff check

      - name: Install Camoufox
        run: uv run camoufox fetch

      - name: Diagnose CSFD crawl
        run: |
          uv run python -c "
          import asyncio
          from crawlee.crawlers import PlaywrightCrawlingContext
          from kino.csfd import get_csfd_crawler
          from kino.scraper import CSFD_URL

          async def main():
              async def handler(context: PlaywrightCrawlingContext):
                  html = await context.page.content()
                  print('title:', await context.page.title())
                  print('content length:', len(html), '| has <body>:', '<body' in html)

              crawler = get_csfd_crawler(request_handler=handler)
              await crawler.run([CSFD_URL])
              failed = crawler.statistics.state.requests_failed
              print('requests_failed:', failed)
              if failed:
                  raise RuntimeError(f'{failed} failed requests')

          asyncio.run(main())
          "
