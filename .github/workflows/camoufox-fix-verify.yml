name: camoufox-fix-verify

# Throwaway: verifies the Camoufox-based fix end to end in real CI (tests,
# lint, actual kino run against live csfd.cz) without the publish/deploy
# steps scrape.yml has. Delete this file once the fix is confirmed.

on:
  push:
    branches: [claude/camoufox-csfd-fix]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Tests
        run: uv run pytest

      - name: Code
        run: uv run ruff check

      - name: Install Camoufox
        run: uv run camoufox fetch

      - name: Scrape
        run: uv run kino

      - name: Show output
        run: ls -la *.ics && head -50 kino.ics
