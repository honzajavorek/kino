name: scrape

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:  # allows running this workflow manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:  # only one concurrent deployment
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Restore film cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/csfd_films
          key: film-cache-${{ github.run_id }}
          restore-keys: |
            film-cache-

      - name: Tests
        run: uv run pytest

      - name: Code
        run: uv run ruff check

      - name: Install Camoufox
        # GITHUB_TOKEN avoids the ~60/hour anonymous GitHub API rate limit
        # that can make this step silently fail to install anything.
        run: GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" uv run camoufox fetch

      - name: Scrape
        run: uv run kino

      - name: Save film cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/csfd_films
          key: film-cache-${{ github.run_id }}

      - name: Publish
        run: mkdir ./site && mv *.ics ./site/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
