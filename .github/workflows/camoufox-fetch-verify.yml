name: camoufox-fetch-verify

on:
  push:
    branches:
      - claude/scrape-action-failure-fckkiv

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Camoufox
        run: GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" uv run camoufox fetch

      - name: Verify installed
        run: uv run python -c "from camoufox.pkgman import installed_verstr; print(installed_verstr())"
